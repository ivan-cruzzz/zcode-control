<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ZCODE Control — панель управления ZCODE из Telegram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#13233d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- декоративная сетка -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 75h1200M0 150h1200M0 225h1200"/>
    <path d="M150 0v300M300 0v300M450 0v300M600 0v300M750 0v300M900 0v300M1050 0v300"/>
  </g>

  <!-- окно терминала -->
  <g transform="translate(72,74)">
    <rect width="480" height="152" rx="16" fill="#0b1220" stroke="#1e293b"/>
    <circle cx="28" cy="26" r="6" fill="#ef4444"/>
    <circle cx="50" cy="26" r="6" fill="#f59e0b"/>
    <circle cx="72" cy="26" r="6" fill="#22c55e"/>
    <text x="240" y="31" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#475569">zcode — session</text>
    <text x="24" y="66" font-family="Menlo, Consolas, monospace" font-size="16" fill="#22c55e">$</text>
    <text x="42" y="66" font-family="Menlo, Consolas, monospace" font-size="16" fill="#e2e8f0">zcode status --from phone</text>
    <text x="24" y="94" font-family="Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">● active · GLM-5.3-Flash · 128.9k tok</text>
    <text x="24" y="122" font-family="Menlo, Consolas, monospace" font-size="14" fill="#475569">▍</text>
  </g>

  <!-- заголовок -->
  <g transform="translate(620,118)">
    <text x="0" y="0" font-family="Menlo, Consolas, monospace" font-size="58" font-weight="700" fill="#f8fafc">ZCODE</text>
    <text x="252" y="0" font-family="Menlo, Consolas, monospace" font-size="58" font-weight="700" fill="url(#accent)">Control</text>
    <text x="2" y="42" font-family="-apple-system, Segoe UI, sans-serif" font-size="21" fill="#94a3b8">Панель управления ZCODE из Telegram</text>
    <g transform="translate(2,72)">
      <rect width="212" height="34" rx="17" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/>
      <circle cx="20" cy="17" r="4" fill="#22c55e"/>
      <text x="34" y="22" font-family="Menlo, Consolas, monospace" font-size="13" fill="#4ade80">live · WebSocket</text>
      <rect x="224" width="160" height="34" rx="17" fill="#1b2336" stroke="#334155"/>
      <text x="242" y="22" font-family="Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">secrets: 0</text>
    </g>
  </g>
</svg>
